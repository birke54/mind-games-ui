name: Build and deploy to S3/CloudFront

on:
  push:
    branches: [ main ]
  workflow_dispatch:         # allow manual runs

env:
  AWS_REGION: us-west-2
  # The bucket CloudFront's default behavior serves. Private; reached only via OAC.
  S3_BUCKET: mind-games-dev-frontend-851725201833-us-west-2-an
  # The distribution that also fronts /api/* — which is what makes the app same-origin with the API,
  # and is the only reason the refresh cookie (SameSite=Strict, Path=/api/v1) survives a login.
  # Set it with:  gh variable set CLOUDFRONT_DISTRIBUTION_ID --body "E..."
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

permissions:
  id-token: write            # required for OIDC federation
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The unit tests need nothing but Node. The e2e suite needs a live backend, so it is not
      # run here — see README for how to run it against a local API.
      - run: npm run test
      - run: npm run build

      # This role must exist and must trust `repo:birke54/mind-games-ui:*` through GitHub's OIDC
      # provider — see docs/deployment.md §4. Until it does, this step fails with
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity", which means no role in the
      # account will accept this repo's token, not that the workflow is misconfigured.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851725201833:role/mind-games-dev-gha-ui
          aws-region: ${{ env.AWS_REGION }}

      # Two passes, because the caching rules are opposite.
      #
      # 1. Hashed assets (/assets/index-D4KZB1aQ.js) are immutable: the name changes whenever the
      #    content does, so they can be cached forever. Upload these FIRST — if index.html went up
      #    first, a viewer could fetch it and then 404 on assets that had not landed yet.
      - name: Upload immutable assets
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/" \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "registerSW.js" \
            --exclude "manifest.webmanifest" \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

      # 2. The entry points must NEVER be cached, or a viewer pins to a stale bundle and never sees
      #    the deploy — the classic SPA deploy bug. What makes a file an entry point is that its
      #    name never changes, so a cached copy is never superseded:
      #
      #      index.html        the document itself
      #      sw.js             the service worker, which decides what everything else is allowed
      #                        to serve from cache
      #      registerSW.js     emitted unhashed by vite-plugin-pwa and loaded from index.html; it
      #                        is what installs the service worker at all. Cached immutably, a
      #                        change to how the app registers its SW would never reach anyone who
      #                        had already visited.
      #      manifest.webmanifest
      #
      #    Everything else vite emits is content-hashed and cannot go stale by construction.
      - name: Upload entry points (no-cache)
        run: |
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"
          for f in sw.js registerSW.js manifest.webmanifest; do
            [ -f "dist/$f" ] && aws s3 cp "dist/$f" "s3://$S3_BUCKET/$f" \
              --cache-control "no-cache,no-store,must-revalidate"
          done

      # CloudFront caches at the edge too, so S3 alone is not enough. Only the never-cached files
      # need invalidating; the hashed ones can't be stale by construction.
      #
      # The invalidation is asynchronous, so we keep its id and wait for it below — verifying before
      # it completes would just read the old edge copy and fail for the wrong reason.
      - name: Invalidate CloudFront
        id: invalidate
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/sw.js" "/registerSW.js" "/manifest.webmanifest" \
            --query 'Invalidation.Id' --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$id"

      # Prove the deploy actually landed.
      #
      # This exists because the failure it catches is silent. A deploy pointed at a bucket
      # CloudFront is not serving does not fail: the sync uploads happily, every step goes green,
      # and the site never changes. That bucket name was wrong once already. Nothing in the steps
      # above can tell the difference — only asking CloudFront what it is actually serving can.
      #
      # The build's entry bundle is content-hashed, so its filename is a fingerprint of this exact
      # commit's output. If the HTML the edge serves names that file, the bytes we just uploaded are
      # the bytes the world is getting.
      - name: Verify the deploy is live
        run: |
          set -euo pipefail

          expected=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          [ -n "$expected" ] || { echo "::error::No hashed entry bundle in dist/index.html — the build is not what this step assumes."; exit 1; }

          site="${SITE_URL:-https://$(aws cloudfront get-distribution \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --query 'Distribution.DomainName' --output text)}"
          echo "Verifying $site"

          served=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            -H 'Cache-Control: no-cache' "$site/index.html?cachebust=$GITHUB_SHA")

          if ! grep -qF "$expected" <<<"$served"; then
            echo "::error::CloudFront is not serving this build. Expected index.html to reference $expected."
            echo "The deploy reported success, so the upload worked — it went somewhere CloudFront is not reading."
            echo "Check that S3_BUCKET ($S3_BUCKET) is the origin behind the default behavior of distribution $CLOUDFRONT_DISTRIBUTION_ID."
            echo "--- what the edge actually served ---"
            grep -o 'assets/index-[A-Za-z0-9_-]*\.js' <<<"$served" || echo "(no hashed bundle referenced at all)"
            exit 1
          fi

          # The HTML naming the bundle is not the same as the bundle being fetchable — a partial
          # sync would still fail here.
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$site/$expected"

          echo "Live: $site is serving $expected"
        env:
          # Optional: set a custom domain with `gh variable set SITE_URL --body "https://..."`.
          # Falls back to the distribution's own cloudfront.net domain.
          SITE_URL: ${{ vars.SITE_URL }}
